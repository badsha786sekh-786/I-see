<title>Welcome</title>
<style>
  :root { --bg:#12081f; --ink:#f6eefc; --glow:#ff3d8b; --iris:#7c5cff; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(circle at 50% 35%, #2a1250 0%, var(--bg) 65%);
    color: var(--ink);
    font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 28px; padding: 24px; text-align: center; overflow: hidden;
  }
  .eye { width: min(60vw, 240px); filter: drop-shadow(0 0 22px var(--glow)); }
  .pupil { transition: transform .12s ease-out; }
  h1 {
    font-size: clamp(1.8rem, 7vw, 3.4rem); font-weight: 800; letter-spacing: .02em;
    text-shadow: 0 0 18px var(--glow);
  }
  .dog { width: min(70vw, 300px); border-radius: 18px; box-shadow: 0 0 28px rgba(124,92,255,.6); }
  .bday { font-size: clamp(1.4rem, 6vw, 2.4rem); color: #ffd84d; text-shadow: 0 0 16px rgba(255,216,77,.6); }
  button {
    background: var(--glow); color: #fff; border: 0; border-radius: 999px;
    padding: 14px 34px; font-size: 1.05rem; font-weight: 700; cursor: pointer;
    box-shadow: 0 0 24px rgba(255,61,139,.6);
  }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  #status { min-height: 1.2em; font-size: .9rem; opacity: .7; }
</style>
</head>

  <h2 class="bday">Happy Birthday bhai! 🎂🎉</h2>
  <button id="btn">Tap to hear</button>
  <p id="status"></p>

<script>
  // ---- Settings ----
  const TEXT = "welcome and i see you. Happy birthday bhai!";
  const TTS_URL = "https://anime.badsha90sekh.workers.dev/";
  const LANG = "en"; // Worker accepts: "hi", "en", "bn"

  const statusEl = document.getElementById("status");
  const btn = document.getElementById("btn");

  function browserVoice() {
    if (!("speechSynthesis" in window)) { statusEl.textContent = "Voice not supported in this browser."; return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(TEXT);
    u.rate = 0.9; u.pitch = 1.2;
    speechSynthesis.speak(u);
  }

  async function speak() {
    statusEl.textContent = "Loading voice…";
    try {
      const res = await fetch(TTS_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: TEXT, lang: LANG })
      });
      if (!res.ok) {
        let detail = "";
        try { detail = (await res.json()).error || ""; } catch {}
        throw new Error("HTTP " + res.status + (detail ? " - " + detail : ""));
      }
      const blob = await res.blob();
      const audio = new Audio(URL.createObjectURL(blob));
      await audio.play();
      statusEl.textContent = "";
    } catch (e) {
      statusEl.textContent = "Error: " + e.message + " | page origin: " + location.origin + " | using browser voice.";
      browserVoice();
    }
  }

  btn.addEventListener("click", speak);

  // Eye follows the pointer
  const pupil = document.getElementById("pupil");
  function look(x, y) {
    const dx = (x / innerWidth - 0.5) * 36;
    const dy = (y / innerHeight - 0.5) * 18;
    pupil.style.transform = `translate(${dx}px, ${dy}px)`;
  }
  addEventListener("pointermove", e => look(e.clientX, e.clientY));
  addEventListener("touchmove", e => look(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
</script>
